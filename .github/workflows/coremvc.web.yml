# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and deploy ASP.Net Core app to an Azure Web App

env:
  AZURE_WEBAPP_NAME: CoreMVC.Web    # set this to the name of your Azure Web App
  AZURE_WEBAPP_PACKAGE_PATH: CoreMVC.Web/publish      # path to the published output for deployment
  DOTNET_VERSION: '10.0.x'                 # set this to the .NET version to use
  BUILD_CONFIGURATION: Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c ${{ env.BUILD_CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test -c ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal
    - name: Publish CoreMVC.Web
      run: dotnet publish CoreMVC.Web/CoreMVC.Web.csproj -c ${{ env.BUILD_CONFIGURATION }} -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.AZURE_WEBAPP_NAME }}
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
