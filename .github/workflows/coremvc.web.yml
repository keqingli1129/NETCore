name: Build and Deploy CoreMVC.Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'CoreMVCWeb'
  AZURE_WEBAPP_PACKAGE_PATH: './publish'
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ./NETCore.sln

      - name: Build
        run: dotnet build ./NETCore.sln -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test ./NETCore.sln -c ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal

      - name: Publish
        run: dotnet publish ./CoreMVC.Web/CoreMVC.Web.csproj -c ${{ env.BUILD_CONFIGURATION }} -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AZURE_WEBAPP_NAME }}          # ← must match download step below
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          overwrite: true

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build                  # runs only after build succeeds
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.AZURE_WEBAPP_NAME }}
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # - name: Deploy to Azure Web App
      #   id: deploy-to-webapp
      #   uses: azure/webapps-deploy@v2
      #   with:
      #     app-name: ${{ env.AZURE_WEBAPP_NAME }}
      #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      #     package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}